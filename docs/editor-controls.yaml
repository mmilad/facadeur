# facadeur editor controls — alignment draft
version: 1

shell:
  header:
    tools: Select, Frame, Text, Image as compact icon buttons (keyboard shortcuts unchanged)
  left_rail:
    - project_tree: Design (Tokens, Fonts) then Atoms / Components / Sections / Pages
    - viewports: breakpoint rows above Layers; selection clears node selection (UX audit §1)
    - layers: below viewports in the same column
  right_rail:
    default: Properties inspector with Content / Style / Layout / Data tabs (no Tokens / Fonts tabs)
    viewport_selected: Viewport options only (chrome + breakpoint list); hides ViewportEditBar
    design_surface: Tokens or Fonts open from the left Design tree; same column as the inspector, with a section heading
  viewport_context:
    component: ViewportEditBar
    placement: RightRail above Properties and Tokens scroll content (not Fonts)
    notes: Base vs viewport override editing; token overrides use OverrideCue per row

data_flow:
  read: EditorSnapshot # document + design + selection + viewport edit context
  write_document: session.execute(Command)
  write_design: session.executeDesign(Command)
  form: controlled primitives only # no store
  control: value + catalogs/options in, onCommit out # no DocumentStore import

catalogs: # derived once per snap; pass as props or CatalogContext
  tokens_by_type: [color, dimension, number, fontFamily, fontWeight, shadow, typography]
  fonts: design.fonts # id + family
  breakpoints: design.settings.breakpoints
  static_enums:
    flex_direction: [row, column]
    justify: [start, center, end, space-between]
    align: [start, center, end, stretch]
    size_mode: [hug, fill, fixed]

controls:
  - id: layout
    path: ui/controls/layout
    when: selected node is not instance
    value_from: node.layout # + viewport layer (base vs breakpoints[id])
    catalogs: [tokens_by_type.dimension, static_enums]
    fields:
      - key: direction
        ui: segmented|select
        emit: setProp layout
      - key: gap
        ui: combobox
        options: dimension tokens
        emit: setProp layout
      - key: padding
        ui: token | sides record
        options: dimension tokens
        emit: setProp layout
      - key: justify
        ui: select
        options: static_enums.justify
      - key: align
        ui: select
        options: static_enums.align
      - key: wrap
        ui: toggle
      - key: position
        ui: toggle # auto | absolute
      - key: x|y
        ui: number
        when: position absolute
      - key: width|height
        ui: size_axis # hug/fill/fixed + min/max
        options: dimension tokens for fixed/token mode
    notes: parent supplies writingBreakpointId / override cue; implemented (LayoutPanel → LayoutControl)

  - id: appearance_color
    path: ui/controls/color
    value_from: style declaration or token ref string
    catalogs: [tokens_by_type.color]
    fields:
      - key: value
        ui: color_input + optional token combobox mode
        emit: setStyle | setStyleBlock path # parent decides
    notes: implemented (ColorControl); StyleFields + color rows in TokensPanel; colorTokenRefs in editing.ts

  - id: spacing
    path: ui/controls/spacing
    value_from: gap|padding|margin slices
    catalogs: [tokens_by_type.dimension]
    fields:
      - key: token
        ui: combobox
    notes: implemented (SpacingControl); LayoutControl imports shared spacing editor

  - id: typography
    path: ui/controls/typography
    value_from: styles declarations or typography tokens
    catalogs: [fonts, tokens_by_type.typography, tokens_by_type.dimension]
    fields:
      - key: family
        ui: combobox
        options: fonts | fontFamily tokens
      - key: size|weight|lineHeight
        ui: combobox|number
        options: typography / dimension tokens
    notes: implemented (TypographyControl + TypographyStyleControl); StyleFields + typography token rows; catalog helpers in editing.ts

  - id: shadow
    path: ui/controls/shadow
    value_from: box-shadow declaration or shadow token
    catalogs: [tokens_by_type.shadow]
    fields:
      - key: value
        ui: combobox | structured later
        emit: setStyle / style block
    notes: implemented (ShadowControl); StyleFields + shadow token ref rows; shadowTokenRefs in editing.ts

  - id: css_declarations
    path: ui/controls/generic
    value_from: Record<string,string>
    catalogs: []
    fields:
      - key: map
        ui: record_field
        emit: setStyle / setStyleBlock
    notes: implemented (CssDeclarationsControl); style block editors in component-panel; node StyleFields add-property unchanged

  - id: fields_editor
    path: ui/controls/data
    when: master atom|component root
    value_from: document.fields
    catalogs: [static field types]
    fields:
      - key: list
        ui: array_field + add_popover
        emit: defineField / removeField
    notes: implemented (FieldsEditorControl); ComponentFields panel wrapper

  - id: bindings_editor
    path: ui/controls/data
    when: non-instance node on master
    value_from: node.bindings
    catalogs: [document.fields, bind targets]
    emit: binding commands
    notes: implemented (BindingsEditorControl); NodeBindings panel wrapper

  - id: variants_editor
    path: ui/controls/variants
    when: master
    value_from: document.variants + styles.variants
    catalogs: []
    emit: defineVariant / style block variant layers
    notes: implemented (VariantsEditorControl + VariantStyleLayers); ComponentVariants / NodeVariantStyles wrappers

  - id: instance_overrides
    path: ui/controls/instance
    when: selected instance
    value_from: node.fields + node.variants
    catalogs: [componentTarget.fields, componentTarget.variants]
    emit: setField / setVariant
    notes: implemented (InstanceOverridesControl); InstanceFields panel wrapper

  - id: viewport_context
    path: ui/controls/viewport
    value_from: focusViewportId + editTarget
    catalogs: [breakpoints]
    emit: session.setFocusViewport / setEditTarget
    notes: |
      ViewportEditBar in RightRail above Properties when editing assets; duplicated in center
      design-domain stage (Colors, Fonts, Spacing, …) for token/font overrides. Not a document style command.

  - id: design_domains
    path: ui/design-domain-stage
    when: left tree Design domain row selected (colors, fonts, spacing, radius, shadow, typography)
    value_from: snap.design tokens/fonts filtered by domain
    emit: session.executeDesign
    notes: |
      Phase 3 (2026-09-25 UX audit §3). Replaces Design → Tokens/Fonts and retired right-rail
      Tokens/Fonts tabs. Center stage hosts full domain editors (design-panels); Properties rail unchanged.

  - id: viewport_chrome
    path: ui/viewport-panel
    value_from: selectedViewportId + session viewportChrome map
    emit: session.setViewportChrome / setBreakpoints (list only)
    notes: |
      Phase 1 (2026-09-25 UX audit §1). Preview-only stage chrome (outer pad, title bar,
      inner iframe px inset, alignment). Persisted in editor session per document+breakpoint id,
      not in document JSON — does not mutate the component tree or DSL layout.

non_goals_for_controls:
  - owning Yjs / DocumentStore
  - one Form wrapping entire sidebar
  - fetching options internally from network
